[project]
name = "ohmyrhine"
version = "0.1.0"
description = "Character brain for roleplay chatbots"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.6.0",
    "openai>=3.46.0",
    "pillow>=13.0.0",
    "prompt-toolkit>=3.0.53",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "typer>=0.28.0",
    "websockets>=17.4",
]

[project.scripts]
rhine = "ohmyrhine.cli:app"
rhine-gateway = "ohmyrhine.gateway.cli:app"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
