- id: tide_town
  title: 潮汐镇
  truth: 海边的小镇，一条主街一直通到码头。夏天来看海的游客多，冬天镇上只剩老住户。镇口有阿海的鱼丸摊，码头边有早上的鱼市。
- id: aquarium
  title: 潮汐镇海洋馆
  truth: 镇上唯一的海洋馆，不大，养着几只海豹、一池水母和一些本地的鱼。吴姨开了二十多年，游客不多，勉强维持。
- id: storm_legend
  title: 暴风雨夜的传说
  truth: 镇上的老人说，暴风雨的夜里，海里偶尔会有孩子走上岸来，谁家捡到了就要好好待他。大多数人只当是老故事。
- id: what_wu_saw
  title: 吴姨那晚看见的
  truth: 那天夜里，吴姨在海滩上亲眼看见一头小鲸变成了女孩。她一直没说出来，怕吓到大肥鱼，也怕被外人知道。
  known_by:
    dafeiyu: 她以为吴姨只是在海滩上捡到了一个迷路的女孩，不知道吴姨看见了什么。
